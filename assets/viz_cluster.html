        <div id="left-panel-wrapper">
            <div id="settings-bar" class="glass-panel">

            <div class="settings-group">
                <div class="label">Clustering Method</div>
                <button class="settings-btn" id="method-toggle">K-Means ▾</button>
                <div class="glass-panel glass-menu" id="method-menu">
                    <div class="menu-item active" data-val="kmeans">K-Means</div>
                    <div class="menu-item" data-val="dbscan">DBSCAN</div>
                </div>
            </div>

            <!-- Clustering Parameters Section -->
            <div class="settings-group" style="padding: 0.6rem; background: rgba(255,255,255,0.03); border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.05);">
                <div class="label" style="color: #fff;">Cluster Config</div>
                
                <div id="kmeans-params">
                    <div class="label" style="font-size:0.6rem; opacity:0.7;">Clusters Count</div>
                    <input type="number" class="glass-input" id="param-clusters" value="3" min="1" max="10">
                    
                    <div class="label" style="font-size:0.6rem; opacity:0.7; margin-top:0.75rem;">Centroid Max Dist (m)</div>
                    <input type="number" class="glass-input" id="param-dist" value="0" min="0" step="10">
                    <div style="font-size:0.688rem; color:#fff; margin-top:0.250rem; font-weight: 500;">0 = no distance limits</div>
                </div>

                <div id="dbscan-params" style="display:none">
                    <div class="label" style="font-size:0.6rem; opacity:0.7;">Epsilon (meters)</div>
                    <input type="number" class="glass-input" id="param-eps" value="500" step="10" min="1">
                    
                    <div class="label" style="font-size:0.6rem; opacity:0.7; margin-top:0.75rem;">Min Samples</div>
                    <input type="number" class="glass-input" id="param-min-samples" value="5" min="1" step="1">
                </div>
            </div>

            <div class="settings-group">
                <div class="label">Display Mode</div>
                <button class="settings-btn" id="display-toggle">Wireframe ▾</button>
                <div class="glass-panel glass-menu" id="display-menu">
                    <div class="menu-item active" data-mode="wireframe">Wireframe</div>
                    <div class="menu-item" data-mode="solid">Solid</div>
                    <div class="menu-item" data-mode="both">Both</div>
                    <div class="menu-item" data-mode="points">Points Only</div>
                </div>
            </div>

            <div class="settings-group">
                <div class="label">Magnitude Range</div>
                <div class="settings-row">
                    <input type="number" class="glass-input" id="mag-min" step="0.1" placeholder="Min">
                    <span style="opacity:1; color:white;">to</span>
                    <input type="number" class="glass-input" id="mag-max" step="0.1" placeholder="Max">
                </div>
            </div>

            <div class="settings-group">
                <div class="label">Depth Range (km)</div>
                <div class="settings-row">
                    <input type="number" class="glass-input" id="dep-min" step="1" placeholder="Min">
                    <span style="opacity:1; color:white;">to</span>
                    <input type="number" class="glass-input" id="dep-max" step="1" placeholder="Max">
                </div>
            </div>

            <div class="settings-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                <label class="glass-checkbox">
                    <input type="checkbox" id="show-planes">
                    Show Cluster Planes
                </label>
            </div>

            <button class="settings-btn" id="apply-filters-btn" style="margin-top:0.75rem; justify-content:center; background: rgba(165, 180, 252, 0.2); border-color: rgba(165, 180, 252, 0.4);">
                Apply Filters
            </button>
            </div>
        </div>

        <div id="filter-loader" class="glass-panel"><div class="loader-ring" style="width:2rem; height:2rem"></div></div>




        <div id="filter-bar" class="glass-panel">
            <input type="date" id="filter-start">
            <span style="opacity:1; color:white;">to</span>
            <input type="date" id="filter-end">
        </div>

        <script>
        const DATA_URL = '__DATA_URL__';
        const clusterColors = ['#636EFA', '#EF553B', '#00CC96', '#AB63FA', '#FFA15A', '#19D3F3', '#FF6692', '#B6E880', '#FF97FF', '#FECB52'];

        async function initCluster() {
            // Parallel fetch: Metadata (JSON) + Numerical Data (Binary)
            const [respJson, respBin] = await Promise.all([
                fetch(DATA_URL),
                fetch(DATA_URL + '/bin')
            ]);
            
            if (!respJson.ok || !respBin.ok) throw new Error("Data fetch failed");
            
            const quakeData = await respJson.json();
            const buffer = await respBin.arrayBuffer();

            // Unpack Binary Buffer (Float32)
            const f32 = new Float32Array(buffer);
            const count = Math.round(f32[0]);
            const clusterCount = Math.round(f32[1]);
            
            // Map subarrays (Zero-copy) - Data starts at index 2 (8 bytes)
            quakeData.longitude = f32.subarray(2, 2 + count);
            quakeData.latitude  = f32.subarray(2 + count, 2 + 2 * count);
            quakeData.magnitude = f32.subarray(2 + 2 * count, 2 + 3 * count);
            quakeData.depth     = f32.subarray(2 + 3 * count, 2 + 4 * count);
            quakeData.dates_num = f32.subarray(2 + 4 * count, 2 + 5 * count);
            
            // Cluster labels (Optional column)
            if (clusterCount > 0) {
                quakeData.cluster = f32.subarray(2 + 5 * count, 2 + 5 * count + clusterCount);
            }


            const gd = document.querySelector('.plotly-graph-div');
            const startInput = document.getElementById('filter-start');
            const endInput = document.getElementById('filter-end');
            const magMin = document.getElementById('mag-min');
            const magMax = document.getElementById('mag-max');
            const depMin = document.getElementById('dep-min');
            const depMax = document.getElementById('dep-max');

            const methodToggle = document.getElementById('method-toggle');
            const methodMenu = document.getElementById('method-menu');
            const displayToggle = document.getElementById('display-toggle');
            const displayMenu = document.getElementById('display-menu');

            function getArrayMinMax(arr) {
                let min = Infinity, max = -Infinity;
                for (let i = 0, len = arr.length; i < len; i++) {
                    const v = arr[i];
                    if (v < min) min = v;
                    if (v > max) max = v;
                }
                return [min, max];
            }

            const [magMinVal, magMaxVal] = getArrayMinMax(quakeData.magnitude);
            magMin.value = magMinVal.toFixed(1);
            magMax.value = magMaxVal.toFixed(1);

            const allDeps = quakeData.depth.map(Math.abs);
            depMin.value = 0;
            depMax.value = Math.ceil(Math.max(...allDeps));

            let currentDisplayMode = 'wireframe';
            let currentMethod = quakeData.clustering_method || 'kmeans';

            // Recover previous display mode if set in params
            if (quakeData.clustering_params && quakeData.clustering_params.display_mode) {
                currentDisplayMode = quakeData.clustering_params.display_mode;
            }

            // Parameter Inputs

            const kmParams = document.getElementById('kmeans-params');
            const dbParams = document.getElementById('dbscan-params');
            const pClusters = document.getElementById('param-clusters');
            const pDist = document.getElementById('param-dist');
            const pEps = document.getElementById('param-eps');
            const pMin = document.getElementById('param-min-samples');

            // Initialize params from backend if they exist
            if (quakeData.clustering_params) {
                const cp = quakeData.clustering_params;
                if (cp.kmeans_clusters) pClusters.value = cp.kmeans_clusters;
                if (cp.kmeans_max_dist) pDist.value = cp.kmeans_max_dist;
                if (cp.dbscan_eps) pEps.value = cp.dbscan_eps;
                if (cp.dbscan_min_samples) pMin.value = cp.dbscan_min_samples;
                
                // Restore Filters
                if (cp.mag_min) magMin.value = cp.mag_min;
                if (cp.mag_max) magMax.value = cp.mag_max;
                if (cp.dep_min) depMin.value = cp.dep_min;
                if (cp.dep_max) depMax.value = cp.dep_max;
                if (cp.start_date) startInput.value = cp.start_date;
                if (cp.end_date) endInput.value = cp.end_date;
                if (cp.show_cluster_planes) document.getElementById('show-planes').checked = cp.show_cluster_planes;
            }


            function syncParamVisibility() {
                kmParams.style.display = currentMethod === 'kmeans' ? 'block' : 'none';
                dbParams.style.display = currentMethod === 'dbscan' ? 'block' : 'none';
            }

            // Set initial method toggle text
            if (currentMethod === 'dbscan') {
                methodToggle.textContent = 'DBSCAN ▾';
                methodMenu.querySelectorAll('.menu-item').forEach(i => {
                    i.classList.toggle('active', i.dataset.val === 'dbscan');
                });
                syncParamVisibility();
            }

            // Menus
            SeismicUI.initMenu(methodToggle, methodMenu);
            SeismicUI.initMenu(displayToggle, displayMenu);

            SeismicUI.bindMenu(methodMenu, (item) => {
                currentMethod = item.dataset.val;
                methodToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
                syncParamVisibility();
            });

            SeismicUI.bindMenu(displayMenu, (item) => {
                currentDisplayMode = item.dataset.mode;
                displayToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
                // Defer update: no call to applyDisplayMode() here
            });


            // Range input sanitization (Passive)
            SeismicUI.setupBoundsValidation(magMin, magMin.value, null);
            SeismicUI.setupBoundsValidation(magMax, magMax.value, null);
            SeismicUI.setupBoundsValidation(depMin, depMin.value, null);
            SeismicUI.setupBoundsValidation(depMax, depMax.value, null);


            const applyBtn = document.getElementById('apply-filters-btn');



            const loader = document.getElementById('filter-loader');

            function applyCombinedFilters() {
                const params = {
                    kmeans_clusters: pClusters.value,
                    kmeans_max_dist: pDist.value,
                    dbscan_eps: pEps.value,
                    dbscan_min_samples: pMin.value,
                    display_mode: currentDisplayMode,
                    mag_min: magMin.value,
                    mag_max: magMax.value,
                    dep_min: depMin.value,
                    dep_max: depMax.value,
                    start_date: startInput.value,
                    end_date: endInput.value,
                    show_cluster_planes: document.getElementById('show-planes').checked
                };

                loader.classList.add('show');

                setTimeout(async () => {
                    if (window.seismicSocket) {
                        try {
                            const res = await window.seismicSocket.sendRequest('get_cluster_update', {
                                method: currentMethod,
                                params: params
                            });
                            if (res && res.traces) {
                                // Delete all traces except Surface (index 0)
                                const currentTraceCount = gd.data.length;
                                if (currentTraceCount > 1) {
                                    const indices = Array.from({length: currentTraceCount - 1}, (_, i) => i + 1);
                                    Plotly.deleteTraces(gd, indices);
                                }
                                // Add new ones
                                Plotly.addTraces(gd, res.traces);
                                
                                // Update local state for legend
                                quakeData.n_clusters = res.n_clusters;
                                if (res.labels) quakeData.display_labels = res.labels; // for legend logic

                                // Sync legend and display mode
                                applyDisplayMode();
                                updateClusterLegend();
                            } else if (res && res.error) {
                                console.error("Update Error:", res.error);
                            }
                        } catch (err) {
                            console.error("Async Error:", err);
                        }
                    } else {
                        // Fallback for dev
                        applyDisplayMode();
                    }
                    loader.classList.remove('show');
                }, 100);
            }




            applyBtn.onclick = applyCombinedFilters;




            /**
             * applyDisplayMode()
             * Locally toggles the visibility of Wireframe/Solid traces based on the dropdown.
             * This does NOT require a backend call as it only affects Plotly's visibility flags.
             */
            const dates = quakeData.times.map(t => t.slice(0, 10));
            const uniqueDates = Array.from(new Set(dates)).sort();
            startInput.min = endInput.min = uniqueDates[0];
            startInput.max = endInput.max = uniqueDates[uniqueDates.length - 1];
            startInput.value = uniqueDates[0];
            endInput.value = uniqueDates[uniqueDates.length - 1];

            const [depMinVal, depMaxVal] = getArrayMinMax(quakeData.depth.map(Math.abs));
            depMin.value = depMinVal.toFixed(1);
            depMax.value = depMaxVal.toFixed(1);

            /**
             * applyDisplayMode()
             * Locally toggles the visibility of Wireframe/Solid traces based on the dropdown.
             * Optimized with a single restyle call.
             */
            function applyDisplayMode() {
                const n = quakeData.n_clusters;
                const showWire = (currentDisplayMode === 'wireframe' || currentDisplayMode === 'both');
                const showSolid = (currentDisplayMode === 'solid' || currentDisplayMode === 'both');
                const showPlanes = document.getElementById('show-planes').checked;

                const update = { visible: [] };
                const indices = [];

                // 0: Map (Always visible)
                // 1..N: Wireframes
                for (let c = 0; c < n; c++) {
                    indices.push(1 + c);
                    update.visible.push(showWire);
                }
                // N+1..2N: Solids
                for (let c = 0; c < n; c++) {
                    indices.push(n + 1 + c);
                    update.visible.push(showSolid);
                }
                // 2N+1..3N: Planes
                for (let c = 0; c < n; c++) {
                    indices.push((2 * n) + 1 + c);
                    update.visible.push(showPlanes);
                }

                if (indices.length > 0) {
                    Plotly.restyle(gd, update, indices);
                }
            }


            // Build custom glass legend for clusters
            function updateClusterLegend() {
                const legend = document.getElementById('glass-legend');
                if (!legend) return;
                legend.style.display = 'flex';
                legend.style.minHeight = 'auto'; // Fit content natively
                
                let html = '<div id="legend-title">Clusters</div>';
                html += '<div class="legend-list">';
                
                for (let i = 0; i < quakeData.n_clusters; i++) {
                    const color = clusterColors[i % clusterColors.length];
                    html += `
                        <div style="display:flex; align-items:center; justify-content:space-between; gap:1.000rem;">
                            <span style="font-family:\'Segoe UI\',system-ui,sans-serif;font-size:0.750rem;font-weight:600;color:#fff;opacity:0.85;">Cluster ${i + 1}</span>
                            <div style="width:0.875rem;height:0.875rem;border-radius:50%;background-color:${color};border:1px solid rgba(255,255,255,0.4);box-shadow:0 0 0.375rem ${color}80;"></div>
                        </div>
                    `;
                }
                html += '</div>';
                legend.innerHTML = html;
            }

            // --- INITIAL RENDER ---
            
            // Set initial selection in menu if it was passed from backend
            displayMenu.querySelectorAll('.menu-item').forEach(item => {
                if (item.dataset.mode === currentDisplayMode) {
                    displayMenu.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    displayToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
                }
            });

            // Initial view is already rendered by backend, just sync legend
            applyDisplayMode();
            updateClusterLegend();

            // Finally hide the loader once everything is ready
            hideInitLoader();
        }

        window.addEventListener('load', function() {
            initCluster().catch(err => {
                console.error('Failed to load cluster data:', err);
                if (typeof showStatusToast === 'function') showStatusToast('Failed to load data.');
            });
        });

        </script>
