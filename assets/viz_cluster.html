<style>
#left-panel-wrapper {
    width: 15.2rem !important;
}
#settings-bar {
    padding-right: 0.35rem;
    overflow-x: hidden;
}
.settings-row {
    width: 100%;
}
.settings-row .glass-input {
    min-width: 0;
    flex: 1 1 0;
    padding: 0 0.5rem;
}
</style>
        <div id="left-panel-wrapper" class="glass-panel">
            <div id="settings-bar">

            <div class="settings-group">
                <div class="label">Clustering Method</div>
                <button class="settings-btn" id="method-toggle">DBSCAN ▾</button>
                <div class="glass-panel glass-menu" id="method-menu">
                    <div class="menu-item" data-val="kmeans">K-Means</div>
                    <div class="menu-item active" data-val="dbscan">DBSCAN</div>
                    <div class="menu-item" data-val="hdbscan">HDBSCAN</div>
                </div>
            </div>

            <!-- Clustering Parameters Section -->
            <div class="settings-group" style="padding: 0.6rem; background: rgba(255,255,255,0.03); border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.05);">
                <div class="label" style="color: #fff;">Cluster Config</div>
                
                <div id="kmeans-params" style="display:none">
                    <label class="label" for="param-clusters" style="font-size:0.6rem; opacity:0.7; display: block;">Clusters Count</label>
                    <input type="number" class="glass-input" id="param-clusters" value="3" min="1" max="10" style="width:100%; height:1.8rem; font-size:0.75rem; margin-bottom:0.5rem;">
                    
                    <label class="label" for="param-dist" style="font-size:0.6rem; opacity:0.7; margin-top:0.75rem; display: block;">Centroid Max Dist (m)</label>
                    <input type="number" class="glass-input" id="param-dist" value="0" min="0" step="10" style="width:100%; height:1.8rem; font-size:0.75rem;">
                    <div style="font-size:0.688rem; color:#fff; margin-top:0.250rem; font-weight: 500;">0 = no distance limits</div>
                </div>

                <div id="dbscan-params" style="display:block">
                    <label class="label" for="param-eps" style="font-size:0.6rem; opacity:0.7; display: block;">Epsilon (meters)</label>
                    <input type="number" class="glass-input" id="param-eps" value="500" step="10" min="1" style="width:100%; height:1.8rem; font-size:0.75rem; margin-bottom:0.5rem;">
                    
                    <label class="label" for="param-min-samples" style="font-size:0.6rem; opacity:0.7; margin-top:0.75rem; display: block;">Min Samples</label>
                    <input type="number" class="glass-input" id="param-min-samples" value="5" min="1" step="1" style="width:100%; height:1.8rem; font-size:0.75rem;">
                </div>

                <div id="hdbscan-params" style="display:none">
                    <label class="label" for="param-hdb-min-cluster" style="font-size:0.6rem; opacity:0.7; display: block;">Min Cluster Size</label>
                    <input type="number" class="glass-input" id="param-hdb-min-cluster" value="5" min="2" step="1" style="width:100%; height:1.8rem; font-size:0.75rem; margin-bottom:0.5rem;">

                    <label class="label" for="param-hdb-min-samples" style="font-size:0.6rem; opacity:0.7; margin-top:0.75rem; display: block;">Min Samples (Noise Sensitivity)</label>
                    <input type="number" class="glass-input" id="param-hdb-min-samples" value="3" min="1" step="1" style="width:100%; height:1.8rem; font-size:0.75rem; margin-bottom:0.5rem;">

                    <label class="label" for="param-hdb-eps" style="font-size:0.6rem; opacity:0.7; margin-top:0.75rem; display: block;">Selection Epsilon (m)</label>
                    <input type="number" class="glass-input" id="param-hdb-eps" value="0" step="10" min="0" style="width:100%; height:1.8rem; font-size:0.75rem;">
                    <div style="font-size:0.688rem; color:#fff; margin-top:0.250rem; font-weight: 500;">0 = automatic hierarchical cutoff</div>
                </div>
            </div>

            <div class="settings-group">
                <div class="label">Display Mode</div>
                <button class="settings-btn" id="display-toggle">Wireframe ▾</button>
                <div class="glass-panel glass-menu" id="display-menu">
                    <div class="menu-item active" data-mode="wireframe">Wireframe</div>
                    <div class="menu-item" data-mode="solid">Solid</div>
                    <div class="menu-item" data-mode="both">Both</div>
                    <div class="menu-item" data-mode="points">Points Only</div>
                </div>
            </div>

            <div class="settings-group">
                <label class="label" for="mag-min">Magnitude Range</label>
                <div class="settings-row">
                    <input type="number" class="glass-input" id="mag-min" step="0.1" placeholder="Min">
                    <span style="opacity:1; color:white;">to</span>
                    <label class="sr-only" for="mag-max" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Max Magnitude</label>
                    <input type="number" class="glass-input" id="mag-max" step="0.1" placeholder="Max">
                </div>
            </div>

            <div class="settings-group">
                <label class="label" for="dep-min">Depth Range (km)</label>
                <div class="settings-row">
                    <input type="number" class="glass-input" id="dep-min" step="1" placeholder="Min">
                    <span style="opacity:1; color:white;">to</span>
                    <label class="sr-only" for="dep-max" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Max Depth</label>
                    <input type="number" class="glass-input" id="dep-max" step="1" placeholder="Max">
                </div>
            </div>

            <div class="settings-group">
                <div class="label">Point Size</div>
                <button class="settings-btn" id="size-toggle">Uniform ▾</button>
                <div class="glass-panel glass-menu" id="size-menu">
                    <div class="menu-item active" data-mode="uniform">Uniform</div>
                    <div class="menu-item" data-mode="magnitude">Magnitude</div>
                </div>
            </div>

            <div class="settings-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                <label class="glass-checkbox">
                    <input type="checkbox" id="show-planes">
                    Show Cluster Planes
                </label>
            </div>

            <div class="settings-group" id="context-points-group" style="display: none; padding-top: 0.5rem;">
                <label class="glass-checkbox">
                    <input type="checkbox" id="show-context-points" checked>
                    Show Other Events
                </label>
            </div>

            <div class="settings-group" id="event-vectors-group" style="padding-top: 0.5rem;">
                <label class="glass-checkbox">
                    <input type="checkbox" id="event-vectors-check">
                    Event Vectors
                </label>
            </div>

            <button id="apply-filters-btn" class="priority-btn" style="margin-top:1.25rem; font-size:0.75rem; height:2.2rem; width:100%; display:flex; justify-content:center; align-items:center; background:rgba(99, 102, 241, 0.2); border:1px solid rgba(99, 102, 241, 0.4); border-radius:0.5rem; color:#fff; cursor:pointer; font-family:inherit; font-weight:600; transition:all 0.2s; flex-shrink: 0;">
                Apply Changes
            </button>
            </div>
        </div>


        <div id="ws-status" title="Server Disconnected"></div>




        <div id="filter-bar" class="glass-panel" style="position: fixed; top: 2.5vh; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 0.75rem; padding: 0 0.8rem; height: 2.5rem;">
            <div style="display: flex; align-items: center; gap: 0.4rem; height: 100%;">
                <label for="filter-start" style="font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05rem; opacity: 0.6; font-weight: 600; line-height: 1; margin-top: 0.1rem; cursor: pointer;">From</label>
                <input type="date" id="filter-start" class="glass-input" style="height: 1.8rem; font-size: 0.7rem; margin: 0; width: 8.2rem; text-align: center;">
            </div>
            <div style="display: flex; align-items: center; gap: 0.4rem; height: 100%;">
                <label for="filter-end" style="font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05rem; opacity: 0.6; font-weight: 600; line-height: 1; margin-top: 0.1rem; cursor: pointer;">To</label>
                <input type="date" id="filter-end" class="glass-input" style="height: 1.8rem; font-size: 0.7rem; margin: 0; width: 8.2rem; text-align: center;">
            </div>
        </div>

<script src="/assets/viz_cluster.js"></script>
