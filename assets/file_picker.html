<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seismic Viewer — Select File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Outfit', sans-serif;
        min-height: 100vh;
        background: #050510;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Ambient Background */
    .bg {
        position: fixed; inset: 0; z-index: -1;
        background: radial-gradient(circle at 20% 30%, #1a1a4e 0%, transparent 40%),
                    radial-gradient(circle at 80% 70%, #0f1c3a 0%, transparent 40%);
    }
    .orb {
        position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15;
        animation: float 20s infinite alternate ease-in-out;
    }
    .orb-1 { width: 600px; height: 600px; background: #6366f1; top: -200px; left: -100px; }
    .orb-2 { width: 500px; height: 500px; background: #ec4899; bottom: -150px; right: -50px; animation-delay: -5s; }
    
    @keyframes float {
        from { transform: translate(0, 0) rotate(0deg); }
        to { transform: translate(50px, 30px) rotate(10deg); }
    }

    /* Glass Container */
    .container {
        position: relative;
        width: 100%; max-width: 500px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(25px) saturate(160%);
        -webkit-backdrop-filter: blur(25px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .logo-container {
        margin-bottom: 30px;
    }
    .logo-blob {
        width: 80px; height: 80px; margin: 0 auto;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        border-radius: 24px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        animation: pulse 4s infinite;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); }
        50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(99, 102, 241, 0.5); }
    }
    .logo-blob svg { width: 40px; height: 40px; fill: #fff; }

    h1 {
        font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px;
        background: linear-gradient(to right, #fff, #a5b4fc);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    p.description { color: #94a3b8; font-size: 15px; margin-bottom: 32px; font-weight: 300; }

    /* Button */
    .btn-pick {
        width: 100%;
        padding: 16px 24px;
        background: #fff;
        color: #050510;
        border: none;
        border-radius: 16px;
        font-size: 16px; font-weight: 600;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 12px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-pick:hover {
        background: #e2e8f0;
        transform: scale(1.02);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .btn-pick:active { transform: scale(0.98); }
    .btn-pick svg { width: 20px; height: 20px; }
    .btn-pick:disabled { opacity: 0.6; cursor: not-allowed; }

    /* File Info */
    .file-card {
        margin-top: 24px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
        display: none;
        animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .info-item { margin-bottom: 12px; }
    .info-item:last-child { margin-bottom: 0; }
    .info-label { font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 1px; font-weight: 600; margin-bottom: 4px; }
    .info-value { font-size: 14px; color: #e2e8f0; font-weight: 400; }

    /* Status & Loading */
    .status-msg { margin-top: 20px; font-size: 14px; min-height: 20px; font-weight: 400; }
    .status-ok { color: #4ade80; }
    .status-error { color: #fb7185; }

    .loader-container {
        display: none;
        margin-top: 20px;
    }
    .bar-container {
        width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;
    }
    .bar-progress {
        width: 0%; height: 100%; background: linear-gradient(to right, #6366f1, #a855f7);
        transition: width 0.3s ease;
    }
</style>
</head>
<body>
    <div class="bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div class="logo-container">
            <div class="logo-blob">
                <svg viewBox="0 0 24 24"><path d="M2 12h3l2-6 3 12 2.5-9L15 15l2-4h5"/></svg>
            </div>
        </div>
        
        <h1>Seismic Viewer</h1>
        <p class="description">Premium data visualization & analysis</p>

        <button class="btn-pick" id="pick-btn" onclick="selectFile()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            Import Dataset
        </button>

        <div class="file-card" id="file-card">
            <div class="info-item">
                <div class="info-label">Current File</div>
                <div class="info-value" id="fi-name">—</div>
            </div>
            <div class="info-item">
                <div class="info-label">Events Detected</div>
                <div class="info-value" id="fi-count">—</div>
            </div>
            <div class="info-item">
                <div class="info-label">Active Period</div>
                <div class="info-value" id="fi-range">—</div>
            </div>
        </div>

        <div class="status-msg" id="status"></div>

        <div class="loader-container" id="loader">
            <div class="bar-container">
                <div class="bar-progress" id="progress-bar"></div>
            </div>
            <p style="font-size: 12px; color: #64748b; margin-top: 8px;">Synchronizing with core engine...</p>
        </div>
    </div>

<script>
    async function selectFile() {
        const btn = document.getElementById('pick-btn');
        const status = document.getElementById('status');
        const card = document.getElementById('file-card');
        const loader = document.getElementById('loader');
        const progressBar = document.getElementById('progress-bar');

        btn.disabled = true;
        status.innerHTML = '';
        card.style.display = 'none';

        try {
            const result = await pywebview.api.select_csv();
            if (!result) {
                btn.disabled = false;
                return;
            }
            if (result.error) {
                status.className = 'status-msg status-error';
                status.textContent = result.error;
                btn.disabled = false;
                return;
            }

            // Success
            document.getElementById('fi-name').textContent = result.filename;
            document.getElementById('fi-count').textContent = result.event_count.toLocaleString() + ' quakes recovered';
            document.getElementById('fi-range').textContent = result.date_range;
            
            card.style.display = 'block';
            status.className = 'status-msg status-ok';
            status.textContent = 'Dataset validated successfully';
            loader.style.display = 'block';

            // Fake progress for aesthetic
            let p = 0;
            const interval = setInterval(() => {
                p += Math.random() * 20;
                if (p > 100) p = 100;
                progressBar.style.width = p + '%';
                if (p === 100) {
                    clearInterval(interval);
                    pywebview.api.navigate_hub();
                }
            }, 100);

        } catch(e) {
            status.className = 'status-msg status-error';
            status.textContent = 'System error: ' + e;
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
