<script>
    // --- Message Synchronization & WebSocket ---
    class SeismicSocket {
        constructor() {
            this.socket = null;
            this.requests = new Map();
            this.requestId = 0;
            this.handlers = new Map();
            this.init();
        }

        init() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            this.socket = new WebSocket(`${protocol}//${host}/ws`);

            this.socket.onopen = () => {
                console.info("SeismicSocket: Connected to backend.");
            };

            this.socket.onopen = () => {
                console.log("WebSocket connected.");
                const ind = document.getElementById('ws-status');
                if (ind) { ind.classList.add('connected'); ind.title = 'Server Connected'; }
            };

            this.socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    this.handleMessage(data);
                } catch (e) {
                    console.error("Socket Message Error:", e);
                }
            };

            this.socket.onclose = () => {
                console.warn("WebSocket disconnected. Retrying in 2s...");
                const ind = document.getElementById('ws-status');
                if (ind) { ind.classList.remove('connected'); ind.title = 'Server Disconnected'; }
                setTimeout(() => this.init(), 2000);
            };

            this.socket.onerror = () => this.socket.close();
        }

        handleMessage(data) {
            if (data.type === 'progress') {
                updateProgress(data.msg);
                // Flash indicator on activity
                const ind = document.getElementById('ws-status');
                if (ind) { ind.classList.add('activity'); setTimeout(() => ind.classList.remove('activity'), 200); }
            } else if (data.type === 'rpc_response') {
                const resolve = this.requests.get(data.id);
                if (resolve) {
                    resolve(data.result);
                    this.requests.delete(data.id);
                }
            }
            // Custom handlers
            const handler = this.handlers.get(data.type);
            if (handler) handler(data);
        }

        /**
         * Send an RPC-like request and await the response.
         */
        sendRequest(type, params) {
            return new Promise((resolve, reject) => {
                if (this.socket.readyState !== WebSocket.OPEN) {
                    // Try to wait a bit if connecting
                    if (this.socket.readyState === WebSocket.CONNECTING) {
                        setTimeout(() => this.sendRequest(type, params).then(resolve).catch(reject), 500);
                        return;
                    }
                    return reject(new Error("Socket not connected"));
                }
                const id = this.requestId++;
                this.requests.set(id, resolve);
                this.socket.send(JSON.stringify({ type, id, params }));
            });
        }
        
        on(type, handler) {
            this.handlers.set(type, handler);
        }
    }

    // Initialize global socket
    window.seismicSocket = new SeismicSocket();

    function updateProgress(msg) {
        // Update the injected init-loader from Python templates
        const initLoaderText = document.querySelector('#init-loader .loader-text');
        if (initLoaderText) {
            initLoaderText.textContent = msg;
        }
        
        // Update the standard loader if present
        const loaderText = document.querySelector('#loader .loader-text');
        if (loaderText) {
            loaderText.textContent = msg;
        }
    }

    function transitionToHub() {
        showInitLoader('Returning to Hub...');
        // Wait for the opacity transition (0.15s) before navigating
        setTimeout(() => {
            window.location.href = '/assets/index.html';
        }, 150);
    }


    let initLoaderTimeout = null;

    function hideInitLoader() {
        const il = document.getElementById('init-loader');
        if (il) {
            if (initLoaderTimeout) clearTimeout(initLoaderTimeout);
            il.style.opacity = '0';
            initLoaderTimeout = setTimeout(() => { 
                il.style.display = 'none';
                const infoBtn = document.getElementById('info-btn');
                if (infoBtn) infoBtn.classList.add('visible');
                const overlayBtn = document.getElementById('overlay-btn');
                if (overlayBtn) overlayBtn.classList.add('visible');
            }, 300);
        }
    }


    function showInitLoader(msg) {
        const il = document.getElementById('init-loader');
        if (il) {
            if (initLoaderTimeout) clearTimeout(initLoaderTimeout);
            const textEl = il.querySelector('.loader-text');
            if (textEl && msg) textEl.textContent = msg;
            il.style.display = 'flex';
            setTimeout(() => { il.style.opacity = '1'; }, 10);
        }
    }



    const SeismicUI = {

        initMenu(btn, menu) {
            if (!btn || !menu) return;
            btn.onclick = (e) => {
                e.stopPropagation();
                const wasShowing = menu.classList.contains('show');
                document.querySelectorAll('.glass-menu').forEach(m => m.classList.remove('show'));
                
                if (!wasShowing) {
                    const rect = btn.getBoundingClientRect();
                    menu.style.position = 'fixed';
                    menu.style.top = rect.top + 'px';
                    menu.style.left = (rect.right + 15) + 'px';
                    menu.classList.add('show');
                }
            };
        },
        bindMenu(menu, callback) {
            if (!menu) return;
            menu.querySelectorAll('.menu-item').forEach(item => {
                item.onclick = () => {
                    menu.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    if (callback) callback(item);
                };
            });
        },
        setupBoundsValidation(input, defaultValue, onApply) {
            if (!input) return;
            input.onblur = () => {
                let val = input.value.trim();
                // Avoid leading zeros unless it's just '0'
                if (/^0[0-9]/.test(val) && val.length > 1 && val[1] !== '.') val = val.replace(/^0+/, '');
                if (!val) val = defaultValue;
                input.value = val;
                if (onApply) onApply();
            };
        },
        setGroupDisabled(el, disabled) {
            if (!el) return;
            if (disabled) el.classList.add('disabled');
            else el.classList.remove('disabled');
        },
        toggleInfoPanel(e) {
            if (e) e.stopPropagation();
            const panel = document.getElementById('info-panel');
            if (!panel) return;

            const isShowing = panel.classList.contains('show');
            
            // Close other menus
            document.querySelectorAll('.glass-menu').forEach(m => m.classList.remove('show'));

            if (!isShowing) {
                // Populate data from global quakeData if available
                const qd = window.quakeData;
                if (qd) {
                    if (qd.graph_bounds) {
                        const gb = qd.graph_bounds; // [min_lat, min_lon, max_lat, max_lon, min_depth]
                        document.getElementById('info-min-lat').textContent = gb[0].toFixed(4) + '°';
                        document.getElementById('info-min-lon').textContent = gb[1].toFixed(4) + '°';
                        document.getElementById('info-max-lat').textContent = gb[2].toFixed(4) + '°';
                        document.getElementById('info-max-lon').textContent = gb[3].toFixed(4) + '°';
                        document.getElementById('info-max-depth').textContent = Math.abs(gb[4]).toFixed(1) + ' km';
                    } else if (qd.bbox) {
                        const b = qd.bbox; // [lat_min, lon_min, lat_max, lon_max]
                        document.getElementById('info-min-lat').textContent = b[0].toFixed(4) + '°';
                        document.getElementById('info-max-lat').textContent = b[2].toFixed(4) + '°';
                        document.getElementById('info-min-lon').textContent = b[1].toFixed(4) + '°';
                        document.getElementById('info-max-lon').textContent = b[3].toFixed(4) + '°';
                        
                        const depths = qd.depth || qd.dep;
                        if (depths && depths.length > 0) {
                            let minVal = depths[0];
                            for (let i = 1; i < depths.length; i++) {
                                if (depths[i] < minVal) minVal = depths[i];
                            }
                            const maxDep = Math.abs(minVal);
                            document.getElementById('info-max-depth').textContent = maxDep.toFixed(1) + ' km';
                        } else if (qd.dep_limit) {
                            document.getElementById('info-max-depth').textContent = Math.abs(qd.dep_limit[0]).toFixed(1) + ' km';
                        }
                    }
                }
                panel.classList.add('show');
            } else {
                panel.classList.remove('show');
            }
        },

        _originalMapData: null,
        _overlayActive: false,

        handleOverlayUpload(input) {
            try {
                if (!input.files || !input.files[0]) return;
                const file = input.files[0];
                const btn = document.getElementById('overlay-btn');
                const loader = document.getElementById('loader');

                const gd = document.querySelector('.plotly-graph-div');
                if (!gd || !gd.data || !gd.data[0]) {
                    showStatusToast('No 3D scene found');
                    input.value = '';
                    return;
                }

                // Access via _fullData for guaranteed property availability
                const traceData = gd._fullData ? gd._fullData[0] : gd.data[0];
                const traceInput = gd.data[0]; // For restyle targeting
                
                console.log('[Overlay] Trace type:', traceData.type);
                console.log('[Overlay] Has surfacecolor:', !!traceData.surfacecolor);
                console.log('[Overlay] x type:', typeof traceData.x, 'length:', traceData.x ? traceData.x.length : 'N/A');
                console.log('[Overlay] y type:', typeof traceData.y, 'length:', traceData.y ? traceData.y.length : 'N/A');

                // Get grid dimensions from the 1D x/y arrays (always reliable)
                const gridCols = traceData.x ? traceData.x.length : 0;
                const gridRows = traceData.y ? traceData.y.length : 0;

                if (!gridRows || !gridCols) {
                    showStatusToast('Cannot detect surface dimensions');
                    console.error('[Overlay] No x/y dimensions found');
                    input.value = '';
                    return;
                }

                console.log('[Overlay] Grid:', gridCols, 'x', gridRows);

                // Save original map data on first use
                if (!this._originalMapData && traceData.surfacecolor) {
                    try {
                        this._originalMapData = {
                            surfacecolor: JSON.parse(JSON.stringify(traceData.surfacecolor)),
                            colorscale: JSON.parse(JSON.stringify(traceData.colorscale)),
                            cmin: traceData.cmin,
                            cmax: traceData.cmax
                        };
                        console.log('[Overlay] Original map data saved');
                    } catch (e) {
                        console.error('[Overlay] Failed to save original:', e);
                    }
                }

                // Show blurred loader
                const loaderText = loader ? loader.querySelector('.loader-text') : null;
                if (loaderText) loaderText.textContent = 'Applying image overlay…';
                if (loader) loader.classList.add('show');

                const self = this; // Capture reference for callbacks

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        setTimeout(function() {
                            try {
                                console.log('[Overlay] Processing image:', img.width, 'x', img.height, '→', gridCols, 'x', gridRows);
                                
                                const canvas = document.createElement('canvas');
                                canvas.width = gridCols;
                                canvas.height = gridRows;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, gridCols, gridRows);

                                const imageData = ctx.getImageData(0, 0, gridCols, gridRows);
                                const pixels = imageData.data;

                                const matrix = [];
                                const colorCounts = new Map();
                                
                                // Step 1: Sample colors and count frequencies (quantized to 5 bits per channel)
                                for (let i = 0; i < pixels.length; i += 4) {
                                    if (pixels[i+3] < 128) continue; // Skip transparent
                                    const qr = pixels[i] >> 3;
                                    const qg = pixels[i+1] >> 3;
                                    const qb = pixels[i+2] >> 3;
                                    const key = (qr << 10) | (qg << 5) | qb;
                                    colorCounts.set(key, (colorCounts.get(key) || 0) + 1);
                                }

                                // Step 2: Pick top 256 colors
                                const sortedColors = Array.from(colorCounts.entries())
                                    .sort((a, b) => b[1] - a[1])
                                    .slice(0, 256);
                                
                                const palette = sortedColors.map(([key]) => [
                                    (key >> 10) << 3,
                                    ((key >> 5) & 31) << 3,
                                    (key & 31) << 3
                                ]);
                                
                                // If image has fewer than 2 colors, add a fallback
                                if (palette.length < 2) palette.push([0,0,0], [255,255,255]);

                                // Step 3: Build colorscale
                                const maxIdx = palette.length - 1;
                                const colorscale = palette.map((c, i) => [
                                    i / maxIdx, 
                                    `rgb(${c[0]},${c[1]},${c[2]})`
                                ]);

                                // Step 4: Map pixels to palette (nearest neighbor)
                                for (let row = 0; row < gridRows; row++) {
                                    const matRow = [];
                                    for (let col = 0; col < gridCols; col++) {
                                        const idx = (row * gridCols + col) * 4;
                                        const r = pixels[idx];
                                        const g = pixels[idx + 1];
                                        const b = pixels[idx + 2];
                                        
                                        // Find closest color in palette (Euclidean distance)
                                        let bestIdx = 0;
                                        let minDist = Infinity;
                                        for (let i = 0; i < palette.length; i++) {
                                            const d = Math.pow(r - palette[i][0], 2) + 
                                                      Math.pow(g - palette[i][1], 2) + 
                                                      Math.pow(b - palette[i][2], 2);
                                            if (d < minDist) {
                                                minDist = d;
                                                bestIdx = i;
                                            }
                                        }
                                        matRow.push(bestIdx);
                                    }
                                    matrix.push(matRow);
                                }

                                console.log('[Overlay] Dynamic palette applied with', palette.length, 'colors.');

                                Plotly.restyle(gd, {
                                    surfacecolor: [matrix],
                                    colorscale: [colorscale],
                                    cmin: [0],
                                    cmax: [maxIdx]
                                }, [0]).then(function() {
                                    console.log('[Overlay] Restyle complete');
                                    btn.classList.add('active');
                                    self._overlayActive = true;
                                    if (loader) loader.classList.remove('show');
                                }).catch(function(err) {
                                    console.error('[Overlay] Restyle failed:', err);
                                    if (loader) loader.classList.remove('show');
                                    showStatusToast('Failed to apply overlay');
                                });
                            } catch (err) {
                                console.error('[Overlay] Processing error:', err);
                                if (loader) loader.classList.remove('show');
                                showStatusToast('Error: ' + err.message);
                            }
                        }, 150);
                    };
                    img.onerror = function() {
                        if (loader) loader.classList.remove('show');
                        showStatusToast('Failed to load image');
                    };
                    img.src = e.target.result;
                };
                reader.onerror = function() {
                    if (loader) loader.classList.remove('show');
                    showStatusToast('Failed to read file');
                };
                reader.readAsDataURL(file);
                input.value = '';
            } catch (err) {
                console.error('[Overlay] Top-level error:', err);
                showStatusToast('Error: ' + err.message);
                const loader = document.getElementById('loader');
                if (loader) loader.classList.remove('show');
            }
        },

        restoreOriginalMap() {
            if (!this._originalMapData) return;
            const gd = document.querySelector('.plotly-graph-div');
            if (!gd) return;

            const loader = document.getElementById('loader');
            const loaderText = loader ? loader.querySelector('.loader-text') : null;
            if (loaderText) loaderText.textContent = 'Restoring original map…';
            if (loader) loader.classList.add('show');

            const self = this;
            setTimeout(function() {
                Plotly.restyle(gd, {
                    surfacecolor: [self._originalMapData.surfacecolor],
                    colorscale: [self._originalMapData.colorscale],
                    cmin: [self._originalMapData.cmin !== undefined ? self._originalMapData.cmin : null],
                    cmax: [self._originalMapData.cmax !== undefined ? self._originalMapData.cmax : null]
                }, [0]).then(function() {
                    const btn = document.getElementById('overlay-btn');
                    btn.classList.remove('active');
                    self._overlayActive = false;
                    if (loader) loader.classList.remove('show');
                }).catch(function() {
                    if (loader) loader.classList.remove('show');
                    showStatusToast('Failed to restore map');
                });
            }, 100);
        }
    };
    document.onclick = () => {
        document.querySelectorAll('.glass-menu').forEach(m => m.classList.remove('show'));
        const infoPanel = document.getElementById('info-panel');
        if (infoPanel) infoPanel.classList.remove('show');
    };

    // Manual loader control only. Templates must call hideInitLoader() explicitly.


    const COLORS_MAP = {
        'Viridis': ['#440154', '#482878', '#3e4989', '#31688e', '#26828e', '#1f9e89', '#6ece58', '#b5de2b', '#fde725'],
        'Plasma': ['#0d0887', '#4b03a1', '#7d03a8', '#a41e9a', '#c33580', '#de4c60', '#f16d41', '#fa9913', '#f6c710', '#eff921'],
        'Inferno': ['#000004', '#160b39', '#420a68', '#6a176e', '#932667', '#bc3754', '#dd513a', '#f37819', '#fca50a', '#f9d22a', '#fcffa4'],

        'Turbo': ['#30123b', '#41459b', '#4675ed', '#419df9', '#2eaede', '#1dbeab', '#24ca70', '#56d445', '#88db32', '#bad928', '#e2c933', '#f8aa31', '#ff842a', '#f75b14', '#e03b07', '#bd2205', '#9a1003', '#7a0403'],
        'Jet': ['#00008f', '#0000ff', '#007fff', '#00ffff', '#7fff7f', '#ffff00', '#ff7f00', '#ff0000', '#7f0000'],
        'Cividis': ['#00224e', '#123570', '#3c4b66', '#6b6d76', '#8e8c82', '#b1ac86', '#d4cd91', '#f8f1ae'],
        'Electric': ['#000000', '#1e008a', '#7d00ba', '#c400b8', '#fe00a2', '#ff5e61', '#ffc100', '#ffff00'],
        'Hot': ['#000000', '#e60000', '#ffcc00', '#ffffff']
    };


    function getPlotlyScale(name) {
        const colors = COLORS_MAP[name] || COLORS_MAP['Viridis'];
        return colors.map((c, i) => [i / (colors.length - 1), c]);
    }


    function updateGlassLegend(show, title, scaleName, invert, limits, dateInfo) {
        const legend = document.getElementById('glass-legend');
        if (!show) { legend.style.display = 'none'; return; }

        legend.style.display = 'flex';
        document.getElementById('legend-title').textContent = title;

        const bar = document.getElementById('legend-bar');
        let colors = COLORS_MAP[scaleName] || COLORS_MAP['Viridis'];
        if (invert) colors = [...colors].reverse();
        bar.style.background = `linear-gradient(to top, ${colors.join(',')})`;

        const ticksContainer = document.getElementById('legend-ticks');
        ticksContainer.innerHTML = '';

        const numTicks = 5;
        const step = (limits[1] - limits[0]) / (numTicks - 1);

        for (let i = numTicks - 1; i >= 0; i--) {
            const val = limits[0] + step * i;
            const tick = document.createElement('div');
            tick.className = 'legend-tick';

            if (title === 'Date' && dateInfo && dateInfo.startDate) {
                const d = new Date(dateInfo.startDate);
                d.setDate(d.getDate() + Math.round(val));
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                tick.textContent = `${day}-${month}-${year}`;
            } else {
                tick.textContent = val.toFixed(1);
            }
            ticksContainer.appendChild(tick);
        }
    }

    function showStatusToast(msg) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span>⚠️ ${msg}</span>`;
        container.appendChild(toast);

        setTimeout(() => toast.classList.add('show'), 100);
    }

    /* ─── 3D Camera & Cinema Mode Logic ─── */
    let cinemaModeActive = false;
    let cinemaAngle = 0;
    let cinemaReqId = null;
    let plotlyId = null;

    function findPlotlyGraph() {
        if (!plotlyId) {
            const gd = document.querySelector('.plotly-graph-div');
            if (gd && gd.id) {
                plotlyId = gd.id;
            } else if (gd) {
                // If ID is missing, assign a temporary one
                gd.id = 'plotly-graph-gen-' + Math.random().toString(36).substr(2, 9);
                plotlyId = gd.id;
            }
        }

        // Show camera controls if we know it's a 3D view or if we found a scene
        if (window.IS_3D_VIEW) {
            const controls = document.getElementById('camera-controls');
            if (controls) controls.style.display = 'flex';
        } else if (plotlyId) {
            const gd = document.getElementById(plotlyId);
            if (gd && gd.layout && gd.layout.scene) {
                const controls = document.getElementById('camera-controls');
                if (controls) controls.style.display = 'flex';
            }
        }
    }

    function toggleCinemaMode() {
        findPlotlyGraph();
        if (!plotlyId) {
            showStatusToast('Waiting for plot initialization...');
            return;
        }

        const gd = document.getElementById(plotlyId);
        if (!gd || !gd.layout || !gd.layout.scene) {
            showStatusToast('Preparing 3D scene...');
            setTimeout(toggleCinemaMode, 200);
            return;
        }


        cinemaModeActive = !cinemaModeActive;
        const btn = document.getElementById('btn-cinema');

        if (cinemaModeActive) {
            btn.classList.add('active');
            
            // Perform a fluid transition to the standard position before starting rotation
            snapToView('reset').then(() => {
                // Ensure we are still in cinema mode after transition
                if (!cinemaModeActive) return;
                
                try {
                    const eye = gd.layout.scene.camera.eye || { x: 1.25, y: 1.25, z: 1.25 };
                    cinemaAngle = Math.atan2(eye.y, eye.x);
                } catch (e) {
                    cinemaAngle = 0;
                }
                animateCinema();
            });
        } else {
            btn.classList.remove('active');
            if (cinemaReqId) cancelAnimationFrame(cinemaReqId);
        }
    }

    function animateCinema() {
        if (!cinemaModeActive) return;
        const gd = document.getElementById(plotlyId);
        if (!gd || !gd.layout || !gd.layout.scene) return;

        cinemaAngle += 0.005; // Speed adjustment
        const radius = 1.8;

        try {
            // Update Background "Skybox"
            const bgX = 50 + 10 * Math.cos(cinemaAngle);
            const bgY = 50 + 10 * Math.sin(cinemaAngle);
            document.body.style.setProperty('--bg-x', `${bgX}%`);
            document.body.style.setProperty('--bg-y', `${bgY}%`);


            const update = {
                'scene.camera.eye': {
                    x: radius * Math.cos(cinemaAngle),
                    y: radius * Math.sin(cinemaAngle),
                    z: 1.0
                }
            };
            Plotly.relayout(gd, update);
        } catch (e) {
            console.warn("Auto-rotation mode skipped frame:", e);
        }

        cinemaReqId = requestAnimationFrame(animateCinema);
    }

    let smoothCameraReqId = null;

    function snapToView(view) {
        if (cinemaModeActive && view !== 'reset' && view !== 'cinema_reset') toggleCinemaMode(); // Stop cinema mode on manual snap
        if (!plotlyId) findPlotlyGraph();
        const gd = document.getElementById(plotlyId);
        if (!gd || !gd.layout || !gd.layout.scene) return Promise.resolve();

        return new Promise((resolve) => {

        let targetEye = { x: 1.25, y: 1.25, z: 1.25 };
        let targetUp = { x: 0, y: 0, z: 1 };
        let targetCenter = { x: 0, y: 0, z: 0 };

        if (view === 'top') {
            // Adding a tiny Y offset (-0.01) avoids the 90deg rotation bug 
            // by giving Plotly a clear "North" direction to align with the screen "Up"
            targetEye = { x: 0, y: -0.01, z: 2.1 };
            targetUp = { x: 0, y: 0, z: 1 };
        } else if (view === 'side') {
            targetEye = { x: 0, y: -1.8, z: 0.15 };
            targetUp = { x: 0, y: 0, z: 1 };
        }

        if (smoothCameraReqId) cancelAnimationFrame(smoothCameraReqId);

        let cam = gd.layout.scene.camera || {};
        let startEye = cam.eye || { x: 1.25, y: 1.25, z: 1.25 };
        let startUp  = cam.up || { x: 0, y: 0, z: 1 };
        let startCenter = cam.center || { x: 0, y: 0, z: 0 };

        const duration = 800;
        const startTime = performance.now();

        function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);

            const currentEye = {
                x: startEye.x + (targetEye.x - startEye.x) * ease,
                y: startEye.y + (targetEye.y - startEye.y) * ease,
                z: startEye.z + (targetEye.z - startEye.z) * ease
            };
            const currentUp = {
                x: startUp.x + (targetUp.x - startUp.x) * ease,
                y: startUp.y + (targetUp.y - startUp.y) * ease,
                z: startUp.z + (targetUp.z - startUp.z) * ease
            };
            const currentCenter = {
                x: startCenter.x + (targetCenter.x - startCenter.x) * ease,
                y: startCenter.y + (targetCenter.y - startCenter.y) * ease,
                z: startCenter.z + (targetCenter.z - startCenter.z) * ease
            };

            if (progress >= 1) {
                Plotly.relayout(gd, {
                    'scene.camera.eye': targetEye,
                    'scene.camera.up': targetUp,
                    'scene.camera.center': targetCenter,
                    'scene.dragmode': 'turntable'
                }).then(() => resolve());
            } else {
                Plotly.relayout(gd, {
                    'scene.camera.eye': currentEye,
                    'scene.camera.up': currentUp,
                    'scene.camera.center': currentCenter
                });
                smoothCameraReqId = requestAnimationFrame(step);
            }
        }
        
        smoothCameraReqId = requestAnimationFrame(step);
        });
    }

    function setGlobalInterfaceLock(locked) {
        const panels = ['camera-controls', 'back-btn', 'settings-bar'];

        panels.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                if (locked) el.classList.add('locked');
                else el.classList.remove('locked');
            }
        });

        if (locked && cinemaModeActive) toggleCinemaMode();

        // Also lock/unlock 3D rotation on the graph
        if (!plotlyId) findPlotlyGraph();
        const gd = document.getElementById(plotlyId);
        if (gd && gd.layout && gd.layout.scene) {
            Plotly.relayout(gd, { 'scene.dragmode': locked ? false : 'turntable' });
        }
    }


    // Auto-detect plot and show UI controls immediately
    setInterval(findPlotlyGraph, 500); // More aggressive periodic check
    findPlotlyGraph();
    window.addEventListener('load', findPlotlyGraph);
    setTimeout(findPlotlyGraph, 100); 
    window.IS_3D_VIEW = true; // Force flag since this is viz_common
</script>
