        <div id="playback-bar" class="glass-panel">
            <div class="play-controls">
                <button id="play-btn">▶</button>
                <button id="pause-btn" class="active">⏸</button>
            </div>
            <div class="slider-container">
                <div id="histogram-map" class="histogram-container"></div>
                <input type="range" id="time-slider" class="slider" min="0" max="100" value="0">
                <div id="current-date">Timeline initializing</div>
            </div>
        </div>

        <div id="left-panel-wrapper">
            <div id="settings-bar" class="glass-panel">
            <div class="settings-group">
                <div class="label">Playback Speed</div>
                <button class="settings-btn" id="speed-toggle">1x ▾</button>
                <div class="glass-panel glass-menu" id="speed-menu">
                    <div class="menu-item active" data-val="1">1x (Real-time)</div>
                    <div class="menu-item" data-val="2">2x</div>
                    <div class="menu-item" data-val="4">4x</div>
                    <div class="menu-item" data-val="8">8x</div>
                    <div class="menu-item" data-val="16">16x</div>
                    <div class="menu-item" data-val="32">32x (Turbo)</div>
                </div>

            </div>
            <div class="settings-group">
                <div class="label">Color Analysis</div>
                <button class="settings-btn" id="color-toggle">Magnitude ▾</button>
                <div class="glass-panel glass-menu" id="color-menu">
                    <div class="menu-item active" data-mode="mag">Magnitude</div>
                    <div class="menu-item" data-mode="date">Date</div>
                    <div class="menu-item" data-mode="dep">Depth</div>
                </div>
            </div>
            <div class="settings-group">
                <div class="label">Color Scale</div>
                <button class="settings-btn" id="scale-toggle">Viridis ▾</button>
                <div class="glass-panel glass-menu" id="scale-menu">
                    <div class="menu-item active" data-val="Viridis">Viridis</div>
                    <div class="menu-item" data-val="Plasma">Plasma</div>
                    <div class="menu-item" data-val="Inferno">Inferno</div>
                    <div class="menu-item" data-val="Turbo">Turbo</div>
                    <div class="menu-item" data-val="Jet">Jet</div>
                    <div class="menu-item" data-val="Cividis">Cividis</div>
                    <div class="menu-item" data-val="Electric">Electric</div>
                    <div class="menu-item" data-val="Hot">Hot</div>
                </div>
            </div>

            <label class="glass-checkbox">
                <input type="checkbox" id="invert-scale">
                Invert Scale
            </label>

            <div class="settings-group" id="structural-settings-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; display:none;">
                <div class="label">Structural Analysis</div>
                <label class="glass-checkbox">
                    <input type="checkbox" id="show-planes">
                    Enable Planes
                </label>
                
                <div id="plane-controls" style="display:none; margin-top:0.75rem;">
                    <div class="label" style="font-size:0.6rem; opacity:0.7;">Cylinder Radius (km)</div>
                    <div class="settings-row" style="margin-bottom:0.5rem;">
                        <input type="number" id="plane-radius" class="glass-input" min="0.1" max="10.0" step="0.1" value="0.5" style="width:100%; height:1.8rem; font-size:0.75rem;">
                    </div>
                    
                    <div class="label" style="font-size:0.6rem; opacity:0.7;">Min Points</div>
                    <div class="settings-row" style="margin-bottom:0.75rem;">
                        <input type="number" id="plane-min-pts" class="glass-input" min="3" max="50" value="4" style="width:100%; height:1.8rem; font-size:0.75rem;">
                    </div>

                    <label class="glass-checkbox" style="margin-bottom:0.75rem;">
                        <input type="checkbox" id="accumulate-planes">
                        Accumulate Planes
                    </label>
                    
                    <button class="settings-btn" id="update-planes-btn" style="margin-top:0.75rem; font-size:0.7rem; height:1.8rem; justify-content:center;">
                        Apply filters
                    </button>
                </div>
            </div>

        </div>

        <div id="jump-bar" class="glass-panel">
            <input type="date" id="jump-date" class="glass-input">
            <button class="settings-btn" id="jump-btn">Go</button>
        </div>

        <div id="stats-hud" class="glass-panel">
            <div class="stats-item">
                <div class="stats-label">Events</div>
                <div class="stats-value" id="stat-count">0</div>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
                <div class="stats-label">Peak Mag</div>
                <div class="stats-value" id="stat-max-mag">0.0</div>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
                <div class="stats-label">Avg Depth</div>
                <div class="stats-value" id="stat-avg-dep">0.0 km</div>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
                <div class="stats-label">Energy</div>
                <div class="stats-value" id="stat-energy">0.0</div>
            </div>
        </div>
    </div>

    <script>
        const quakeData = __QUAKES_JSON__;


        window.addEventListener('load', function() {
            const gd = document.querySelector('.plotly-graph-div');
            const playBtn = document.getElementById('play-btn');
            const pauseBtn = document.getElementById('pause-btn');
            const slider = document.getElementById('time-slider');
            const dateDisplay = document.getElementById('current-date');
            const speedToggle = document.getElementById('speed-toggle');
            const speedMenu = document.getElementById('speed-menu');
            const colorToggle = document.getElementById('color-toggle');
            const colorMenu = document.getElementById('color-menu');
            const scaleToggle = document.getElementById('scale-toggle');
            const scaleMenu = document.getElementById('scale-menu');
            const invertCheck = document.getElementById('invert-scale');
            const jumpBtn = document.getElementById('jump-btn');
            const jumpDate = document.getElementById('jump-date');
            const histogramMap = document.getElementById('histogram-map');
            
            const showPlanesCheck = document.getElementById('show-planes');
            const planeControls = document.getElementById('plane-controls');
            const planeRadius = document.getElementById('plane-radius');
            const planeMinPts = document.getElementById('plane-min-pts');
            const accumulatePlanesCheck = document.getElementById('accumulate-planes');
            const updatePlanesBtn = document.getElementById('update-planes-btn');

            let isPlaying = false;
            let currentStepIdx = 0;
            let currentMode = 'mag'; 
            let currentColorScale = 'Viridis';
            let invertScale = false;
            
            let planesEnabled = false;
            let accumulatePlanes = false;
            let structuralPlanes = null; // Mapping date -> planes
            let persistentPlanesMap = new Map(); // grid_id -> plane_data (for accumulation)
            let lastAccumIdx = -1;
            
            let baseDelay = 1000; 
            let speedMult = 1;
            
            let startTime = 0;
            let startIdx = 0;
            let animId = null;

            const dates = quakeData.unique_dates;
            slider.max = dates.length - 1;
            jumpDate.min = dates[0];
            jumpDate.max = dates[dates.length - 1];
            jumpDate.value = dates[0];

            function formatDate(isoStr) {
                if (!isoStr) return '';
                const parts = isoStr.split('-');
                if (parts.length !== 3) return isoStr;
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }

            function getActiveRange(idx) {
                const date = dates[idx];
                const endIdx = quakeData.date_to_cum[date];
                let startIdx = 0;

                if (quakeData.anim_mode === 'window') {
                    const cutoffDate = new Date(new Date(date).getTime() - (quakeData.window_days - 1) * 86400000);
                    const cutoffStr = cutoffDate.toISOString().slice(0, 10);
                    
                    let low = 0, high = dates.length - 1;
                    let foundIdx = 0;
                    while (low <= high) {
                        let mid = (low + high) >>> 1;
                        if (dates[mid] >= cutoffStr) {
                            foundIdx = mid;
                            high = mid - 1;
                        } else {
                            low = mid + 1;
                        }
                    }
                    if (foundIdx > 0) startIdx = quakeData.date_to_cum[dates[foundIdx - 1]];
                }
                return [startIdx, endIdx];
            }

            function updateView(idx) {
                if (idx < 0) idx = 0;
                if (idx >= dates.length) idx = dates.length - 1;
                
                const [start, end] = getActiveRange(idx);
                
                const sliceLon = quakeData.lon.slice(start, end);
                const sliceLat = quakeData.lat.slice(start, end);
                const sliceDep = quakeData.dep.slice(start, end);
                const sliceMag = quakeData.mag.slice(start, end);
                const sliceDnum = quakeData.dnum.slice(start, end);
                const sliceHover = quakeData.hover.slice(start, end);

                let sliceColor, visibleTraceIdx, limits, barTitle;
                const isDate = (currentMode === 'date');
                if (currentMode === 'mag') {
                    sliceColor = sliceMag;
                    visibleTraceIdx = 1;
                    limits = quakeData.mag_range;
                    barTitle = 'Magnitude';
                } else if (isDate) {
                    sliceColor = sliceDnum;
                    visibleTraceIdx = 2;
                    limits = quakeData.date_range;
                    barTitle = 'Date';
                } else {
                    sliceColor = sliceDep;
                    visibleTraceIdx = 3;
                    limits = quakeData.dep_range;
                    barTitle = 'Depth';
                }

                const restyleUpdate = {
                    x: [sliceLon], 
                    y: [sliceLat], 
                    z: [sliceDep],
                    'marker.size': [5],
                    'marker.color': [sliceColor],
                    'marker.colorscale': [getPlotlyScale(currentColorScale)],
                    'marker.reversescale': [invertScale],
                    'marker.cmin': [limits[0]],
                    'marker.cmax': [limits[1]],
                    'marker.showscale': [false],
                    'marker.opacity': [0.85],
                    hovertext: [sliceHover]
                };


                // --- Optimized Multi-Trace Update ---
                const bulkUpdate = {
                    ...restyleUpdate
                };
                const traceIndices = [visibleTraceIdx];

                if (planesEnabled && structuralPlanes) {
                    // Accumulation Logic
                    if (accumulatePlanes) {
                        // If we jumped backwards, reset the map and the accumulation index
                        if (idx < lastAccumIdx) {
                            persistentPlanesMap.clear();
                            lastAccumIdx = -1;
                        }
                        
                        // Fill map from lastAccumIdx+1 to idx
                        for (let i = Math.max(0, lastAccumIdx + 1); i <= idx; i++) {
                            const daily = structuralPlanes[dates[i]] || [];
                            daily.forEach(p => persistentPlanesMap.set(p.grid_id, p));
                        }
                        lastAccumIdx = idx;
                        
                        const meshData = generatePlaneMesh(Array.from(persistentPlanesMap.values()));
                        bulkUpdate.x = [...(bulkUpdate.x || []), meshData.x[0]];
                        bulkUpdate.y = [...(bulkUpdate.y || []), meshData.y[0]];
                        bulkUpdate.z = [...(bulkUpdate.z || []), meshData.z[0]];
                        bulkUpdate.i = [...(bulkUpdate.i || []), meshData.i[0]];
                        bulkUpdate.j = [...(bulkUpdate.j || []), meshData.j[0]];
                        bulkUpdate.k = [...(bulkUpdate.k || []), meshData.k[0]];
                        bulkUpdate.facecolor = [...(bulkUpdate.facecolor || []), meshData.facecolor[0]];
                    } else {
                        const datePlanes = structuralPlanes[dates[idx]] || [];
                        const meshData = generatePlaneMesh(datePlanes);
                        bulkUpdate.x = [...(bulkUpdate.x || []), meshData.x[0]];
                        bulkUpdate.y = [...(bulkUpdate.y || []), meshData.y[0]];
                        bulkUpdate.z = [...(bulkUpdate.z || []), meshData.z[0]];
                        bulkUpdate.i = [...(bulkUpdate.i || []), meshData.i[0]];
                        bulkUpdate.j = [...(bulkUpdate.j || []), meshData.j[0]];
                        bulkUpdate.k = [...(bulkUpdate.k || []), meshData.k[0]];
                        bulkUpdate.facecolor = [...(bulkUpdate.facecolor || []), meshData.facecolor[0]];
                    }
                    bulkUpdate.visible = [...Array(traceIndices.length).fill(true), true];
                    traceIndices.push(4);
                } else {
                    bulkUpdate.visible = [...Array(traceIndices.length).fill(true), false];
                    traceIndices.push(4);
                }

                Plotly.restyle(gd, bulkUpdate, traceIndices);
                
                dateDisplay.textContent = formatDate(dates[idx]);
                slider.value = idx;
                currentStepIdx = idx;


                // Update Glass Legend
                updateGlassLegend(
                    true,
                    barTitle,
                    currentColorScale,
                    invertScale,
                    limits,
                    { startDate: quakeData.start_date }
                );

                const dayEnd = quakeData.date_to_cum[dates[idx]];
                const dayStart = (idx > 0) ? quakeData.date_to_cum[dates[idx-1]] : 0;
                updateHUD(start, end, dayStart, dayEnd);

                // Update Histogram Bars
                const bars = histogramMap.children;
                if (bars.length > 0) {
                    for (let i = 0; i < bars.length; i++) {
                        if (i === idx) bars[i].classList.add('active');
                        else bars[i].classList.remove('active');
                    }
                }
            }

            function renderHistogram() {
                const counts = quakeData.date_counts;
                if (!counts || counts.length === 0) return;
                
                const maxCount = Math.max(...counts);
                histogramMap.innerHTML = '';
                
                counts.forEach((count, i) => {
                    const bar = document.createElement('div');
                    bar.className = 'hist-bar';
                    const h = Math.max(2, (count / maxCount) * 100);
                    bar.style.height = `${h}%`;
                    bar.title = `${dates[i]}: ${count} events`;
                    
                    bar.onclick = (e) => {
                        e.stopPropagation();
                        pause();
                        updateView(i);
                    };
                    
                    histogramMap.appendChild(bar);
                });
            }

            function updateHUD(windowStart, windowEnd, frameStart, frameEnd) {
                const sliceMagWindow = quakeData.mag.slice(windowStart, windowEnd);
                const sliceDepWindow = quakeData.dep.slice(windowStart, windowEnd);
                const sliceMagFrame = quakeData.mag.slice(frameStart, frameEnd);
                
                const count = sliceMagWindow.length;
                if (count === 0) {
                    document.getElementById('stat-count').textContent = '0';
                    document.getElementById('stat-max-mag').textContent = '0.0';
                    document.getElementById('stat-avg-dep').textContent = '0.0 km';
                    document.getElementById('stat-energy').textContent = '0.0';
                    return;
                }
                
                const maxMag = Math.max(...sliceMagWindow);
                const avgDep = sliceDepWindow.reduce((a, b) => a + b, 0) / count;
                
                // Energy Release (kJ) using Gutenberg-Richter relation: log10(E) = 4.8 + 1.5 * M
                // We divide by 1000 for kJ, so the constant becomes 4.8 - 3 = 1.8
                let totalEnergy = 0;
                for (let m of sliceMagFrame) {
                    totalEnergy += Math.pow(10, 1.8 + 1.5 * m);
                }
                
                let energyStr = totalEnergy.toExponential(1);
                if (totalEnergy < 1e6) energyStr = Math.round(totalEnergy).toLocaleString();
                
                document.getElementById('stat-count').textContent = count.toLocaleString();
                document.getElementById('stat-max-mag').textContent = maxMag.toFixed(1);
                document.getElementById('stat-avg-dep').textContent = `${Math.abs(avgDep).toFixed(1)} km`;
                document.getElementById('stat-energy').textContent = energyStr;
            }

            function updateTimeline() {
                updateView(currentStepIdx);
            }

            function generatePlaneMesh(planes) {
                if (!planes || planes.length === 0) {
                    return { x: [[]], y: [[]], z: [[]], i: [[]], j: [[]], k: [[]], facecolor: [[]] };
                }

                const allX = [], allY = [], allZ = [];
                const allI = [], allJ = [], allK = [];
                const allColors = [];
                let vertOffset = 0;

                const nSegments = 16; 

                planes.forEach(p => {
                    allX.push(...p.x);
                    allY.push(...p.y);
                    allZ.push(...p.z);

                    const color = `rgba(0, 243, 255, ${0.5 + p.planarity * 0.4})`;
                    for (let i = 1; i < nSegments - 1; i++) {
                        allI.push(vertOffset);
                        allJ.push(vertOffset + i);
                        allK.push(vertOffset + i + 1);
                        allColors.push(color);
                    }
                    vertOffset += nSegments;
                });

                return {
                    x: [allX], y: [allY], z: [allZ],
                    i: [allI], j: [allJ], k: [allK],
                    facecolor: [allColors]
                };
            }

            async function syncPlanes() {
                if (!planesEnabled) return;
                
                showInitLoader("Analyzing structural planes...");
                try {
                    const result = await pywebview.api.get_structural_planes(
                        planeRadius.value,
                        planeMinPts.value,
                        quakeData.window_days
                    );
                    
                    if (result && !result.error) {
                        structuralPlanes = result;
                        persistentPlanesMap.clear();
                        lastAccumIdx = -1;
                        updateView(currentStepIdx);
                    } else {
                        console.error("Plane Calculation Error:", result?.error);
                    }
                } catch (e) {
                    console.error("Bridge Error:", e);
                } finally {
                    hideInitLoader();
                }
            }



            function animationLoop(timestamp) {
                if (!isPlaying) return;
                if (!startTime) {
                    startTime = timestamp;
                    startIdx = currentStepIdx;
                }
                const elapsed = timestamp - startTime;
                const secondsPassed = Math.floor(elapsed / baseDelay);
                const targetIdx = startIdx + (secondsPassed * speedMult);
                
                if (targetIdx !== currentStepIdx && targetIdx < dates.length) {
                    updateView(targetIdx);
                } else if (targetIdx >= dates.length) {
                    updateView(dates.length - 1);
                    pause();
                    return;
                }
                animId = requestAnimationFrame(animationLoop);
            }

            function play() {
                if (isPlaying) return;
                if (currentStepIdx >= dates.length - 1) {
                    currentStepIdx = 0;
                    updateView(0);
                }
                isPlaying = true;
                startTime = 0; 
                playBtn.classList.add('active');
                pauseBtn.classList.remove('active');
                if (typeof setGlobalInterfaceLock === 'function') setGlobalInterfaceLock(true);
                animId = requestAnimationFrame(animationLoop);
            }

            function pause() {
                isPlaying = false;
                if (animId) {
                    cancelAnimationFrame(animId);
                    animId = null;
                }
                startTime = 0; 
                playBtn.classList.remove('active');
                pauseBtn.classList.add('active');
                if (typeof setGlobalInterfaceLock === 'function') setGlobalInterfaceLock(false);
                
                // Explicitly stop cinema mode (auto-rotation) when pausing
                if (typeof cinemaModeActive !== 'undefined' && cinemaModeActive) {
                    toggleCinemaMode();
                }
            }



            playBtn.onclick = play;
            pauseBtn.onclick = pause;

            slider.oninput = () => {
                pause();
                updateView(parseInt(slider.value));
            };

            // Menus

            SeismicUI.initMenu(speedToggle, speedMenu);
            SeismicUI.initMenu(colorToggle, colorMenu);
            SeismicUI.initMenu(scaleToggle, scaleMenu);

            SeismicUI.bindMenu(speedMenu, (item) => {
                speedMult = parseFloat(item.dataset.val);
                speedToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
            });

            SeismicUI.bindMenu(colorMenu, (item) => {
                currentMode = item.dataset.mode;
                colorToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
                const traceIdx = (currentMode === 'mag') ? 1 : (currentMode === 'date' ? 2 : 3);
                const otherIdx1 = (traceIdx === 1) ? 2 : 1;
                const otherIdx2 = (traceIdx === 3) ? 2 : 3;
                Plotly.restyle(gd, { visible: [false] }, [otherIdx1, otherIdx2]);
                Plotly.restyle(gd, { visible: [true] }, [traceIdx]);
                updateTimeline();
            });

            SeismicUI.bindMenu(scaleMenu, (item) => {
                currentColorScale = item.dataset.val;
                scaleToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
                updateTimeline();
            });

            invertCheck.onchange = () => {
                invertScale = invertCheck.checked;
                updateTimeline();
            };

            jumpBtn.onclick = () => {
                const target = jumpDate.value;
                if (!target) return;
                
                const idx = dates.findIndex(d => d >= target);
                if (idx !== -1) {
                    pause();
                    updateView(idx);
                } else {
                    // Fallback to last date if target is beyond range
                    pause();
                    updateView(dates.length - 1);
                }
            };

            // Plane Controls
            showPlanesCheck.onchange = () => {
                planesEnabled = showPlanesCheck.checked;
                planeControls.style.display = planesEnabled ? 'block' : 'none';
                if (planesEnabled && !structuralPlanes) {
                    syncPlanes();
                } else {
                    persistentPlanesMap.clear();
                    lastAccumIdx = -1;
                    updateView(currentStepIdx);
                }
            };

            accumulatePlanesCheck.onchange = () => {
                accumulatePlanes = accumulatePlanesCheck.checked;
                persistentPlanesMap.clear();
                lastAccumIdx = -1;
                updateView(currentStepIdx);
            };

            // Plane Radius/MinPts updates (using inputs now)
            planeRadius.onchange = () => {
                if (planeRadius.value < 0.1) planeRadius.value = 0.1;
            };
            planeMinPts.onchange = () => {
                if (planeMinPts.value < 3) planeMinPts.value = 3;
            };
            updatePlanesBtn.onclick = syncPlanes;

            // Add the Plane Trace (Trace 4)
            Plotly.addTraces(gd, {
                type: 'mesh3d',
                x: [[]], y: [[]], z: [[]],
                i: [[]], j: [[]], k: [[]],
                opacity: 0.8,
                color: '#00f3ff',
                name: 'Structural Planes',
                hoverinfo: 'skip',
                visible: false,
                lighting: { ambient: 0.9, diffuse: 0.5, specular: 0.1, roughness: 0.9, fresnel: 0.1 },
                flatshading: true
            });

            renderHistogram();
            updateView(0);

            // Show structural panel only if we have a real time window (not cumulative)
            if (quakeData.anim_mode === 'window') {
                document.getElementById('structural-settings-group').style.display = 'block';
            } else {
                document.getElementById('structural-settings-group').style.display = 'none';
            }
        });
        </script>
