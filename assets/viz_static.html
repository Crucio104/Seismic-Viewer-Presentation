        <div id="left-panel-wrapper" class="glass-panel">
            <div id="settings-bar">
            <div class="settings-group" id="view-mode-group" style="display:none;">
                <label class="label" for="view-mode-toggle">View Type</label>
                <button class="settings-btn" id="view-mode-toggle">Scatter ▾</button>
                <div class="glass-panel glass-menu" id="view-mode-menu">
                    <div class="menu-item active" data-mode="scatter">Scatter Plot</div>
                    <div class="menu-item" data-mode="heatmap">Heatmap</div>
                </div>
            </div>

            <div class="settings-group">
                <label class="label" for="color-toggle">Color Mode</label>
                <button class="settings-btn" id="color-toggle">Depth ▾</button>
                <div class="glass-panel glass-menu" id="color-menu">
                    <div class="menu-item active" data-mode="dep">Depth</div>
                    <div class="menu-item" data-mode="mag">Magnitude</div>
                    <div class="menu-item" data-mode="date">Date</div>
                </div>
            </div>

            <div class="settings-group">
                <label class="label" for="scale-toggle">Color Scale</label>
                <button class="settings-btn" id="scale-toggle">Viridis ▾</button>
                <div class="glass-panel glass-menu" id="scale-menu">
                    <div class="menu-item active" data-val="Viridis">Viridis</div>
                    <div class="menu-item" data-val="Plasma">Plasma</div>
                    <div class="menu-item" data-val="Inferno">Inferno</div>
                    <div class="menu-item" data-val="Turbo">Turbo</div>
                    <div class="menu-item" data-val="Jet">Jet</div>
                    <div class="menu-item" data-val="Cividis">Cividis</div>
                    <div class="menu-item" data-val="Electric">Electric</div>
                    <div class="menu-item" data-val="Hot">Hot</div>
                </div>
            </div>

            <label class="glass-checkbox">
                <input type="checkbox" id="invert-scale">
                Invert Scale
            </label>


            <div class="settings-group">
                <label class="label" for="mag-min">Magnitude Range</label>
                <div class="settings-row">
                    <input type="number" class="glass-input" id="mag-min" step="0.1" placeholder="Min">
                    <span style="opacity:1; color:white;">to</span>
                    <label class="sr-only" for="mag-max" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Max Magnitude</label>
                    <input type="number" class="glass-input" id="mag-max" step="0.1" placeholder="Max">
                </div>
            </div>

            <div class="settings-group" id="point-size-group">
                <div class="label">Point Size</div>
                <button class="settings-btn" id="size-toggle">Uniform ▾</button>
                <div class="glass-panel glass-menu" id="size-menu">
                    <div class="menu-item active" data-mode="uniform">Uniform</div>
                    <div class="menu-item" data-mode="magnitude">Magnitude</div>
                </div>
            </div>

            <div class="settings-group">
                <label class="label" for="dep-min">Depth Range (km)</label>
                <div class="settings-row">
                    <input type="number" class="glass-input" id="dep-min" step="1" placeholder="Min">
                    <span style="opacity:1; color:white;">to</span>
                    <label class="sr-only" for="dep-max" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Max Depth</label>
                    <input type="number" class="glass-input" id="dep-max" step="1" placeholder="Max">
                </div>
            </div>

            <button id="apply-filters-btn" class="priority-btn" style="margin-top:1.25rem; font-size:0.75rem; height:2.2rem; width:100%; display:flex; justify-content:center; align-items:center; background:rgba(99, 102, 241, 0.2); border:1px solid rgba(99, 102, 241, 0.4); border-radius:0.5rem; color:#fff; cursor:pointer; font-family:inherit; font-weight:600; transition:all 0.2s; flex-shrink: 0;">
                Apply Filters
            </button>

            <button id="reset-camera" class="priority-btn" style="margin-top:0.5rem; font-size:0.75rem; height:2.2rem; width:100%; display:none; justify-content:center; align-items:center; background:rgba(165, 180, 252, 0.2); border:1px solid rgba(165, 180, 252, 0.4); border-radius:0.5rem; color:#fff; cursor:pointer; font-family:inherit; font-weight:600; transition:all 0.2s; flex-shrink: 0;">
                Reset Camera
            </button>

            </div>
        </div>

        <div id="filter-loader"><div class="loader-ring" style="width:1.875rem; height:1.875rem"></div></div>
        <div id="ws-status" title="Server Disconnected"></div>

        <div id="filter-bar" class="glass-panel" style="position: fixed; top: 2.5vh; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 0.75rem; padding: 0 0.8rem; height: 2.5rem;">
            <div style="display: flex; align-items: center; gap: 0.4rem; height: 100%;">
                <label for="filter-start" style="font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05rem; opacity: 0.6; font-weight: 600; line-height: 1; margin-top: 0.1rem; cursor: pointer;">From</label>
                <input type="date" id="filter-start" class="glass-input" style="height: 1.8rem; font-size: 0.7rem; margin: 0; width: 8.2rem; text-align: center;">
            </div>
            <div style="display: flex; align-items: center; gap: 0.4rem; height: 100%;">
                <label for="filter-end" style="font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05rem; opacity: 0.6; font-weight: 600; line-height: 1; margin-top: 0.1rem; cursor: pointer;">To</label>
                <input type="date" id="filter-end" class="glass-input" style="height: 1.8rem; font-size: 0.7rem; margin: 0; width: 8.2rem; text-align: center;">
            </div>
        </div>

        <script>
        const DATA_URL = '__DATA_URL__';

        async function initVisualization() {
            // Parallel fetch: Metadata (JSON) + Numerical Data (Binary)
            const [respJson, respBin] = await Promise.all([
                fetch(DATA_URL),
                fetch(DATA_URL + '/bin')
            ]);
            
            if (!respJson.ok || !respBin.ok) throw new Error("Data fetch failed");
            
            window.quakeData = await respJson.json();
            const buffer = await respBin.arrayBuffer();
            
            // Unpack Binary Buffer (Float32)
            const f32 = new Float32Array(buffer);
            const count = Math.round(f32[0]);
            
            // Map subarrays (Zero-copy) - Data starts at index 2 (8 bytes)
            quakeData.longitude = f32.subarray(2, 2 + count);
            quakeData.latitude  = f32.subarray(2 + count, 2 + 2 * count);
            quakeData.magnitude = f32.subarray(2 + 2 * count, 2 + 3 * count);
            quakeData.depth     = f32.subarray(2 + 3 * count, 2 + 4 * count);
            quakeData.dates_num = f32.subarray(2 + 4 * count, 2 + 5 * count);
            // Ignore cluster labels in static view

            const gd = document.querySelector('.plotly-graph-div');
            const startInput = document.getElementById('filter-start');
            const endInput = document.getElementById('filter-end');
            const magMin = document.getElementById('mag-min');
            const magMax = document.getElementById('mag-max');
            const depMin = document.getElementById('dep-min');
            const depMax = document.getElementById('dep-max');
            const invertCheck = document.getElementById('invert-scale');
            
            const colorToggle = document.getElementById('color-toggle');
            const colorMenu = document.getElementById('color-menu');
            const scaleToggle = document.getElementById('scale-toggle');
            const scaleMenu = document.getElementById('scale-menu');
            const viewModeToggle = document.getElementById('view-mode-toggle');
            const viewModeMenu = document.getElementById('view-mode-menu');
            const viewModeGroup = document.getElementById('view-mode-group');
            const applyBtn = document.getElementById('apply-filters-btn');


            const dates = quakeData.times.map(t => t.slice(0, 10));
            const uniqueDates = Array.from(new Set(dates)).sort();

            startInput.min = endInput.min = uniqueDates[0];
            startInput.max = endInput.max = uniqueDates[uniqueDates.length - 1];
            startInput.value = uniqueDates[0];
            endInput.value = uniqueDates[uniqueDates.length - 1];

            if (quakeData.mag_range && quakeData.mag_range.length >= 2) {
                magMin.value = quakeData.mag_range[0].toFixed(1);
                magMax.value = quakeData.mag_range[1].toFixed(1);
            } else {
                let minM = Infinity, maxM = -Infinity;
                for (let i = 0; i < quakeData.magnitude.length; i++) {
                    const v = quakeData.magnitude[i];
                    if (v < minM) minM = v;
                    if (v > maxM) maxM = v;
                }
                magMin.value = (minM !== Infinity ? minM : 0).toFixed(1);
                magMax.value = (maxM !== -Infinity ? maxM : 10).toFixed(1);
            }

            if (quakeData.dep_range && quakeData.dep_range.length >= 2) {
                depMin.value = 0;
                depMax.value = Math.ceil(Math.max(Math.abs(quakeData.dep_range[0]), Math.abs(quakeData.dep_range[1])));
            } else {
                let maxD = 0;
                for (let i = 0; i < quakeData.depth.length; i++) {
                    const d = Math.abs(quakeData.depth[i]);
                    if (d > maxD) maxD = d;
                }
                depMin.value = 0;
                depMax.value = Math.ceil(maxD);
            }

            let currentColorMode = 'dep';
            let currentColorScale = 'Viridis';
            let currentViewMode = 'points';

            let invertScale = false;

            const is3D = (gd.layout.scene !== undefined);
            if (!is3D && gd.data.length > 1) viewModeGroup.style.display = 'block';

             const resetBtn = document.getElementById('reset-camera');
             let initialMapboxView = null;
 
             if (!is3D) {
                 resetBtn.style.display = 'flex';
                 document.getElementById('point-size-group').style.display = 'none';
                 // Store initial view after a small delay to ensure Plotly has initialized mapbox
                 setTimeout(() => {
                     if (gd.layout.mapbox) {
                         initialMapboxView = {
                             center: { ...gd.layout.mapbox.center },
                             zoom: gd.layout.mapbox.zoom,
                             pitch: gd.layout.mapbox.pitch || 0,
                             bearing: gd.layout.mapbox.bearing || 0
                         };
                     }
                 }, 500);
 
                 resetBtn.onclick = () => {
                     if (initialMapboxView) {
                         Plotly.relayout(gd, {
                             'mapbox.center': initialMapboxView.center,
                             'mapbox.zoom': initialMapboxView.zoom,
                             'mapbox.pitch': 0,
                             'mapbox.bearing': 0
                         });
                     }
                 };
             }


            // Menus
            SeismicUI.initMenu(colorToggle, colorMenu);
            SeismicUI.initMenu(scaleToggle, scaleMenu);
            if (viewModeToggle) SeismicUI.initMenu(viewModeToggle, viewModeMenu);

            SeismicUI.bindMenu(colorMenu, (item) => {
                currentColorMode = item.dataset.mode;
                colorToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
                window._userExplicitColorSelection = true;
                applyFilterWithLoader();
            });

            SeismicUI.bindMenu(scaleMenu, (item) => {
                currentColorScale = item.dataset.val;
                scaleToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
                applyFilterWithLoader();
            });

            if (viewModeMenu) {
                SeismicUI.bindMenu(viewModeMenu, (item) => {
                    currentViewMode = item.dataset.mode;
                    viewModeToggle.textContent = item.textContent.split(' ')[0] + ' ▾';
                    const isHeatmap = (currentViewMode === 'heatmap');
                    SeismicUI.setGroupDisabled(scaleToggle.closest('.settings-group'), isHeatmap);
                    SeismicUI.setGroupDisabled(colorToggle.closest('.settings-group'), isHeatmap);
                    SeismicUI.setGroupDisabled(invertCheck.closest('.glass-checkbox'), isHeatmap);
                    applyFilterWithLoader();
                });
            }


            const sizeToggle = document.getElementById('size-toggle');
            const sizeMenu = document.getElementById('size-menu');
            let currentSizeMode = is3D ? 'uniform' : 'magnitude';

            SeismicUI.initMenu(sizeToggle, sizeMenu);
            if (!is3D) {
                if (sizeToggle) sizeToggle.textContent = 'Magnitude ▾';
                if (sizeMenu) {
                    const items = sizeMenu.querySelectorAll('.menu-item');
                    items.forEach(i => {
                        if (i.dataset.mode === 'magnitude') i.classList.add('active');
                        else i.classList.remove('active');
                    });
                }
            }

            SeismicUI.bindMenu(sizeMenu, (item) => {
                currentSizeMode = item.dataset.mode;
                sizeToggle.textContent = item.textContent + ' ▾';
                applyFilterWithLoader();
            });

            const rangeApplyCallback = null;

            invertCheck.onchange = () => {
                invertScale = invertCheck.checked;
                applyFilterWithLoader();
            };

            // Range input sanitization
            SeismicUI.setupBoundsValidation(magMin, magMin.value, rangeApplyCallback);
            SeismicUI.setupBoundsValidation(magMax, magMax.value, rangeApplyCallback);
            SeismicUI.setupBoundsValidation(depMin, depMin.value, rangeApplyCallback);
            SeismicUI.setupBoundsValidation(depMax, depMax.value, rangeApplyCallback);

             const filterLoader = document.getElementById('filter-loader');

            // Real-time updates for sliders/inputs
            [startInput, endInput, magMin, magMax, depMin, depMax].forEach(input => {
                if (input) {
                    input.addEventListener('change', () => {
                        if ((input === startInput || input === endInput) && !window._userExplicitColorSelection) {
                            currentColorMode = 'date';
                            if (colorToggle) colorToggle.textContent = 'Date ▾';
                        }
                        applyFilterWithLoader();
                    });
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            if ((input === startInput || input === endInput) && !window._userExplicitColorSelection) {
                                currentColorMode = 'date';
                                if (colorToggle) colorToggle.textContent = 'Date ▾';
                            }
                            applyFilterWithLoader();
                        }
                    });
                }
            });


            function applyFilterWithLoader() {
                if (is3D) {
                    filterLoader.classList.add('show');
                    setTimeout(() => {
                        try { applyFilter(); } catch (e) { console.error('Filter Error:', e); }
                        setTimeout(() => filterLoader.classList.remove('show'), 80);
                    }, 40);
                } else {
                    try { applyFilter(); } catch (e) { console.error('Filter Error:', e); }
                }
            }

            if (is3D) {
                applyBtn.onclick = applyFilterWithLoader;
                // Initial filter run to sync filtered state and vectors
                applyFilter();
                // Manually trigger initial legend update for 3D
                setTimeout(() => {
                    updateGlassLegend(true, 'Depth (KM)', currentColorScale, invertScale, quakeData.dep_limit || quakeData.dep_range, { startDate: quakeData.start_date });
                }, 10);
            } else {
                applyBtn.style.display = 'flex';
                applyBtn.onclick = applyFilterWithLoader;
                applyFilterWithLoader();
            }

            function applyFilter() {
                const start = startInput.value ? startInput.value.trim() : '';
                const end = endInput.value ? endInput.value.trim() : '';
                const m1 = parseFloat(magMin.value) || 0, m2 = parseFloat(magMax.value) || 9.9;
                const d1 = parseFloat(depMin.value) || 0, d2 = parseFloat(depMax.value) || 9999;
                const indices = [];

                for (let i = 0; i < dates.length; i++) {
                    const dt = dates[i];
                    const m = quakeData.magnitude[i];
                    const d = Math.abs(quakeData.depth[i]);
                    const dateMatch = (!start || dt >= start) && (!end || dt <= end);
                    const magMatch = (m >= m1 && m <= m2);
                    const depMatch = (d >= d1 && d <= d2);
                    if (dateMatch && magMatch && depMatch) indices.push(i);
                }

                const filtered = {
                    lon: indices.map(i => quakeData.longitude[i]),
                    lat: indices.map(i => quakeData.latitude[i]),
                    mag: indices.map(i => quakeData.magnitude[i]),
                    dep: indices.map(i => quakeData.depth[i]),
                    times: indices.map(i => quakeData.times[i]),
                    dnum: indices.map(i => quakeData.dates_num[i]),
                    hover: indices.map(i => (quakeData.hover && quakeData.hover[i]) ? quakeData.hover[i] : `Date: ${quakeData.times ? quakeData.times[i] : ''}<br>Magnitude: ${quakeData.magnitude[i].toFixed(1)}<br>Depth: ${Math.abs(quakeData.depth[i]).toFixed(1)} km`)
                };

                window.currentFilteredData = {
                    longitude: filtered.lon,
                    latitude: filtered.lat,
                    depth: filtered.dep,
                    magnitude: filtered.mag,
                    times: filtered.times
                };
                if (window.quakeData) {
                    window.quakeData.filtered = window.currentFilteredData;
                }

                const isHeatmap = (currentViewMode === 'heatmap');
                const isDep = (currentColorMode === 'dep');
                const isMag = (currentColorMode === 'mag');
                const isDate = (currentColorMode === 'date');

                let limits, colorArr, barTitle;
                if (isDep) {
                    limits = quakeData.dep_limit || quakeData.dep_range;
                    colorArr = filtered.dep;
                    barTitle = 'Depth (KM)';
                } else if (isMag) {
                    limits = quakeData.mag_limit || quakeData.mag_range;
                    colorArr = filtered.mag;
                    barTitle = 'Magnitude';
                } else {
                    let minD = Infinity, maxD = -Infinity;
                    for (let i = 0; i < filtered.dnum.length; i++) {
                        const val = filtered.dnum[i];
                        if (val < minD) minD = val;
                        if (val > maxD) maxD = val;
                    }

                    const getOffset = (dateStr) => {
                        if (!dateStr || !quakeData.start_date) return null;
                        const p1 = String(dateStr).split('-').map(Number);
                        const p2 = String(quakeData.start_date).split('-').map(Number);
                        if (p1.length < 3 || p2.length < 3) return null;
                        const t1 = Date.UTC(p1[0], p1[1] - 1, p1[2]);
                        const t2 = Date.UTC(p2[0], p2[1] - 1, p2[2]);
                        return (t1 - t2) / 86400000;
                    };

                    const sOffset = getOffset(start);
                    const eOffset = getOffset(end);

                    let minVal = (sOffset !== null && !isNaN(sOffset)) ? sOffset : minD;
                    let maxVal = (eOffset !== null && !isNaN(eOffset)) ? eOffset : maxD;

                    if (minVal === Infinity || maxVal === -Infinity) {
                        limits = quakeData.date_limit || quakeData.date_range || [0, 1];
                    } else if (minVal >= maxVal) {
                        limits = [minVal, minVal + 1];
                    } else {
                        limits = [minVal, maxVal];
                    }

                    colorArr = filtered.dnum;
                    barTitle = 'Date';
                }

                const maxMag = filtered.mag.length > 0 ? filtered.mag.reduce((acc, m) => Math.max(acc, m), 0.1) : 1;
                const markerSizes = currentSizeMode === 'magnitude' 
                    ? (is3D ? filtered.mag.map(m => Math.max(8, Math.pow(Math.max(0, m), 2) * 1.5))
                            : filtered.mag.map(m => Math.max(0.1, m)))
                    : (is3D ? 5 : 6);

                if (is3D) {
                    let depthIdx = -1, dateIdx = -1;
                    for (let i = 0; i < gd.data.length; i++) {
                        const tr = gd.data[i];
                        if (!tr) continue;
                        const name = tr.name || '';
                        if (name === 'Earthquakes (Depth)' || (tr.type === 'scatter3d' && i === 1 && !name.includes('Date') && !name.includes('Stations') && !name.includes('Uplift') && !name.includes('Tomography') && !name.includes('Tomografia'))) {
                            depthIdx = i;
                        } else if (name === 'Earthquakes (Date)' || (tr.type === 'scatter3d' && i === 2 && !name.includes('Depth') && !name.includes('Stations') && !name.includes('Uplift') && !name.includes('Tomography') && !name.includes('Tomografia'))) {
                            dateIdx = i;
                        }
                    }
                    const traceIdx = isDate ? (dateIdx !== -1 ? dateIdx : 2) : (depthIdx !== -1 ? depthIdx : 1);
                    const otherIdx = isDate ? (depthIdx !== -1 ? depthIdx : 1) : (dateIdx !== -1 ? dateIdx : 2);

                    if (otherIdx !== -1 && otherIdx < gd.data.length) {
                        Plotly.restyle(gd, { visible: [false] }, [otherIdx]);
                    }
                    if (traceIdx !== -1 && traceIdx < gd.data.length) {
                        Plotly.restyle(gd, {
                            x: [filtered.lon], y: [filtered.lat], z: [filtered.dep],
                            'marker.size': [markerSizes],
                            'marker.color': [colorArr],
                            'marker.cmin': [limits[0]],
                            'marker.cmax': [limits[1]],
                            'marker.colorscale': [getPlotlyScale(currentColorScale)],
                            'marker.reversescale': [invertScale],
                            'marker.showscale': [false],
                            hovertext: [filtered.hover], visible: [true]
                        }, [traceIdx]);
                    }
                } else {
                    let scatterIdx = -1, heatmapIdx = -1;
                    for (let i = 0; i < gd.data.length; i++) {
                        const tr = gd.data[i];
                        if (!tr) continue;
                        const name = tr.name || '';
                        if (tr.type === 'densitymapbox' && (name === 'Heatmap' || name === 'Earthquakes (Heatmap)')) {
                            heatmapIdx = i;
                        } else if (tr.type === 'scattermapbox' && (name === 'Earthquakes (Scatter)' || name === 'Earthquakes' || (!name.includes('Stations') && !name.includes('Uplift') && !name.includes('Tomography') && !name.includes('Tomografia') && name !== 'Heatmap' && name !== 'Earthquakes (Heatmap)'))) {
                            scatterIdx = i;
                        }
                    }

                    if (isHeatmap) {
                        if (scatterIdx !== -1) Plotly.restyle(gd, { visible: [false] }, [scatterIdx]);
                        if (heatmapIdx !== -1) {
                            Plotly.restyle(gd, { lat: [filtered.lat], lon: [filtered.lon], z: [filtered.mag], visible: [true], hovertext: [filtered.hover] }, [heatmapIdx]);
                        }
                    } else {
                        if (heatmapIdx !== -1) Plotly.restyle(gd, { visible: [false] }, [heatmapIdx]);
                        if (scatterIdx !== -1) {
                            const update = {
                                lat: [filtered.lat], lon: [filtered.lon],
                                'marker.size': [markerSizes],
                                'marker.color': [colorArr],
                                'marker.cmin': [limits[0]],
                                'marker.cmax': [limits[1]],
                                'marker.colorscale': [getPlotlyScale(currentColorScale)],
                                'marker.coloraxis': [null],
                                'marker.reversescale': [invertScale],
                                'marker.showscale': [false],
                                hovertext: [filtered.hover], visible: [true]
                            };
                            if (currentSizeMode === 'magnitude') {
                                update['marker.sizemode'] = ['area'];
                                update['marker.sizeref'] = [maxMag / 400];
                            } else {
                                update['marker.sizemode'] = ['diameter'];
                                update['marker.sizeref'] = [1];
                            }
                            Plotly.restyle(gd, update, [scatterIdx]);
                        }
                    }
                }
                if (window.SeismicUI && typeof window.SeismicUI.bringMarkersToFront === 'function') {
                    window.SeismicUI.bringMarkersToFront();
                }

                
                // Update Glass Legend
                updateGlassLegend(
                    currentViewMode !== 'heatmap',
                    barTitle,
                    currentColorScale,
                    invertScale,
                    limits,
                    { startDate: quakeData.start_date }
                );

                if (window.SeismicUI && window.SeismicUI._activeConsecutiveArrows) {
                    window.SeismicUI.toggleConsecutiveArrows(true);
                }
            }

            // Finally hide the loader once everything is ready
            hideInitLoader();
        }

        window.addEventListener('load', function() {
            initVisualization().catch(err => {
                console.error('Failed to load visualization data:', err);
                if (typeof showStatusToast === 'function') showStatusToast('Failed to load data.');
            });
        });

        </script>
